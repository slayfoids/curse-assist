<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="CURSE — color-guided pointer accessibility">
  <defs>
    <radialGradient id="bg1" cx="15%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3b1a6e"/>
      <stop offset="55%" stop-color="#150a26"/>
      <stop offset="100%" stop-color="#07040c"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg1)"/>
  <circle cx="150" cy="40" r="260" fill="url(#glow1)"/>
  <circle cx="1080" cy="250" r="240" fill="url(#glow2)"/>

  <!-- faint grid -->
  <g stroke="#c8a0ff" stroke-opacity=".05">
    <path d="M0 70h1200M0 140h1200M0 210h1200"/>
    <path d="M200 0v280M400 0v280M600 0v280M800 0v280M1000 0v280"/>
  </g>

  <!-- crosshair motif -->
  <g transform="translate(1010,140)" stroke="#c084fc" fill="none">
    <circle r="86" stroke-opacity=".8" stroke-width="2.5"/>
    <circle r="60" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle r="30" stroke="#d946ef" stroke-opacity=".9" stroke-width="2"/>
    <path d="M-104 0h30M74 0h30M0 -104v30M0 74v30" stroke-width="2.5" stroke-opacity=".8"/>
    <circle r="5" fill="#f0abfc" stroke="none"/>
  </g>

  <text x="90" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="86"
        font-weight="800" letter-spacing="26" fill="url(#word)">CURSE</text>
  <rect x="94" y="176" width="420" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="94" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="21"
        letter-spacing="3" fill="#9b90ad">COLOR-GUIDED POINTER ACCESSIBILITY FOR WINDOWS</text>
</svg>
